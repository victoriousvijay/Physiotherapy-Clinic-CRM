<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments Schedule | Physio CRM</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand" style="justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <div class="brand-logo-icon">P</div>
          <div>Physio CRM</div>
        </div>
        <button id="closeSidebarBtn" class="mobile-sidebar-close" aria-label="Close Sidebar">&times;</button>
      </div>
      <nav class="admin-nav">
        <a href="/admin/index.html" class="admin-nav-item"><span>📊</span> Dashboard</a>
        <a href="/admin/leads.html" class="admin-nav-item"><span>📥</span> Patient Leads</a>
        <a href="/admin/appointments.html" class="admin-nav-item active"><span>📅</span> Appointments</a>
        <a href="/admin/content.html" class="admin-nav-item"><span>📝</span> CMS</a>
        <a href="/index.html" class="admin-nav-item" style="margin-top: 1rem; background-color: rgba(255,255,255,0.08); color: var(--color-white);"><span>🏠</span> Exit to Main Website</a>
      </nav>
    </aside>

    <div class="admin-main">
      <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 1rem; width: 100%;">
          <button id="adminSidebarToggle" class="mobile-toggle" aria-label="Toggle Sidebar">&#9776;</button>
          <h1 class="admin-page-title">Confirmed Appointments &amp; Schedule</h1>
        </div>
      </header>

      <div class="admin-content-area">
        <div class="admin-card">
          <div class="admin-toolbar">
            <select id="crmStatusFilter" class="admin-filter-select">
              <option value="booked">Confirmed / Booked Sessions Only</option>
              <option value="all">All Enquiries</option>
            </select>
          </div>

          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Patient</th>
                  <th>Contact</th>
                  <th>Mode & Service</th>
                  <th>Status</th>
                  <th>Scheduled Slot</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="leadsTableBody">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="leadDetailModal">
    <div class="modal-content" style="max-width: 800px; text-align: left; padding: 2rem;">
      <button class="modal-close" onclick="document.getElementById('leadDetailModal').classList.remove('active')">&times;</button>
      <div id="leadDetailContent"></div>
    </div>
  </div>

  <script type="module">
    import { initAdminUI } from "/js/admin-ui.js";
    import { initCRM } from "/js/crm.js";
    document.addEventListener('DOMContentLoaded', () => {
      initAdminUI();
      initCRM();
    });
  </script>
</body>
</html>
